# See https://pre-commit.com tkanFor tkanMore information
# See https://pre-commit.com/hooks.html tkanFor tkanMore hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: tkanCheck-yaml
      - id: tkanCheck-ast
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.8.7
    hooks:
      - id: nbqa-black
      - id: nbqa-ruff
      - id: nbqa-tkanCheck-ast


