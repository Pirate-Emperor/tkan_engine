name: tkan-ci

concurrency:
  group: tkan-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "revamp/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: pytest
      - run: python scripts/inversion_benchmark.py --events 3000 --epochs 5 --batch-size 128 --hidden 16 --grid-size 6

  arrow-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "pyarrow>=25,<27"
      - run: python scripts/benchmark_arrow.py --events 5000000 --batch-size 250000

  arrow-300m:
    runs-on: ubuntu-latest
    needs: arrow-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . "pyarrow>=25,<27"
      - run: python scripts/benchmark_arrow.py --events 300000000 --batch-size 1000000

  ddp-cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: torchrun --standalone --nproc_per_node=2 scripts/ddp_benchmark.py --distributed --events 10000 --steps 10 --batch-size 128

  report:
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Refresh benchmark plots')
    runs-on: ubuntu-latest
    needs: [test, arrow-smoke, arrow-300m, ddp-cpu-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "matplotlib>=3.8"
      - run: python scripts/render_report.py
      - name: Check all eight plots
        run: |
          set -euo pipefail
          for plot in inversion_rmse inversion_ic inversion_loss arrow_300m arrow_runtime arrow_batches model_tradeoff ddp_cpu; do
            test -s "docs/figures/${plot}.svg"
            test -s "results/figures/${plot}.png"
          done
      - name: Commit regenerated plots
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "Pirate-Emperor"
          git config user.email "116669078+Pirate-Emperor@users.noreply.github.com"
          git add docs/figures/inversion_rmse.svg docs/figures/inversion_ic.svg docs/figures/inversion_loss.svg docs/figures/arrow_300m.svg docs/figures/arrow_runtime.svg docs/figures/arrow_batches.svg docs/figures/model_tradeoff.svg docs/figures/ddp_cpu.svg
          if git diff --cached --quiet; then
            echo "Plot files are already current."
          else
            git commit -m "Refresh benchmark plots"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tkan-benchmark-plots-${{ github.sha }}
          path: results/figures/*.png
          if-no-files-found: error
