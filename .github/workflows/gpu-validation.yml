name: A100 GPU benchmark

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gpu-validation:
    runs-on: [self-hosted, Linux, X64, gpu, a100, integrator-1]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Require main branch for published results
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run this workflow against main so the measured results are published there."
            exit 2
          fi

      - name: Check NVIDIA driver and CUDA PyTorch
        shell: bash
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available in the runner's current Python environment.")
          count = torch.cuda.device_count()
          if count < 1:
              raise SystemExit("No CUDA devices are visible.")
          print("PyTorch:", torch.__version__)
          print("Visible GPUs:", count)
          for index in range(count):
              props = torch.cuda.get_device_properties(index)
              print(f"GPU {index}: {props.name}; memory={props.total_memory / (1024**3):.1f} GiB")
          with open(__import__("os").environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"GPU_COUNT={count}\n")
          PY

      - name: Install project test and report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"

      - name: Run complete test suite
        run: pytest

      - name: Re-run nonlinear inversion benchmark
        run: python scripts/inversion_benchmark.py --events 3000 --epochs 5 --batch-size 128 --hidden 16 --grid-size 6

      - name: Run 300M-event Arrow stress test
        run: python scripts/benchmark_arrow.py --events 300000000 --batch-size 1000000

      - name: Measure single-, two- and four-GPU throughput
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for count in 1 2 4; do
            if [ "$count" -le "$GPU_COUNT" ]; then
              echo "Benchmarking with $count GPU(s)"
              torchrun --standalone --nproc_per_node="$count" scripts/ddp_benchmark.py \
                --distributed --events 65536 --seq-len 64 --features 15 \
                --hidden 96 --depth 2 --grid-size 8 --batch-size 128 \
                --warmup 5 --steps 25 --out "results/ddp_benchmark_${count}gpu.json"
            else
              echo "Skipping $count-GPU run; only $GPU_COUNT GPU(s) are available."
            fi
          done

      - name: Profile a CUDA training step
        run: python scripts/profile_gpu.py --batch 128 --seq-len 64 --features 15 --hidden 96 --steps 10 --measure-steps 50 --out results/gpu_profile.txt --metrics-out results/gpu_profile_metrics.json

      - name: Regenerate plots and measured report
        run: |
          python -m pip install "matplotlib>=3.8"
          python scripts/render_report.py
          python scripts/update_gpu_report.py

      - name: Publish measured GPU results to main
        shell: bash
        run: |
          git config user.name "Pirate-Emperor"
          git config user.email "116669078+Pirate-Emperor@users.noreply.github.com"
          git add README.md docs/BENCHMARK_STATUS.md docs/figures/*.svg results/ddp_benchmark_*gpu.json results/gpu_profile.txt results/gpu_profile_metrics.json results/arrow_benchmark.json results/inversion_benchmark.json
          if git diff --cached --quiet; then
            echo "No new benchmark outputs to commit."
          else
            git commit -m "Record A100 benchmark results"
            git push origin "HEAD:main"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tkan-a100-validation-${{ github.run_id }}
          path: |
            results/*.json
            results/gpu_profile.txt
            docs/figures/*.svg
          if-no-files-found: warn
